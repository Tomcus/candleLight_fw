name: prusa_x_nfc_01 firmware

on:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: carlosperate/arm-none-eabi-gcc-action@v1
    - run: cmake -B build -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi-gcc.cmake
    - run: cmake --build build --target prusa_x_nfc_01_fw
    - id: meta
      run: |
        echo "date=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"
        echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
    - uses: softprops/action-gh-release@v2
      with:
        tag_name: fw-${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.sha }}
        name: prusa_x_nfc_01 firmware ${{ steps.meta.outputs.date }} (${{ steps.meta.outputs.sha }})
        files: build/prusa_x_nfc_01_fw.bin
        body: |
          STM32H503 `prusa_x_nfc_01` gs_usb firmware, built from ${{ github.sha }}.

          Flash with an ST-LINK (see `openocd_h5.cfg`):
          ```
          openocd -f openocd_h5.cfg -c "program prusa_x_nfc_01_fw.bin 0x08000000 verify reset exit"
          ```
