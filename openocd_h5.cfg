# OpenOCD config for the STM32H503 "prusa_x_nfc_01" board via ST-LINK.
#
# Flash the firmware (one-liner):
#   openocd -f openocd_h5.cfg -c "program build/prusa_x_nfc_01_fw verify reset exit"
#
# The STM32H5 debug target needs multi-AP SWD, so it uses the DAP-capable
# st-link driver (dapdirect), not the plain hla driver in openocd.cfg. This
# requires an ST-LINK-V3 or an ST-LINK/V2 with firmware >= J24.

source [find interface/stlink-dap.cfg]
transport select dapdirect_swd
source [find target/stm32h5x.cfg]
